name: Diagnóstico de preço/certificado (temporário)
on:
  push:
    branches: [claude/project-thread-18t4c2]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python diag_preco_temp.py
