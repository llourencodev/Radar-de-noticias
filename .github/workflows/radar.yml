name: Coletar notícias e publicar o site

on:
  schedule:
    - cron: "7 * * * *"        # a cada hora (minuto 7, horário UTC)
  workflow_dispatch: {}         # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ["app/**", "config/**", "web/**", "gerar_site.py", "requirements.txt", ".github/workflows/radar.yml"]

# cada job recebe só a permissão de que precisa (o código que lê sites externos roda sem poder de escrita)
permissions: {}

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TZ: America/Sao_Paulo
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_MAX_PER_RUN: ${{ vars.LLM_MAX_PER_RUN || '40' }}
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}   # contador de acessos (opcional, ver README)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # o banco SQLite (histórico, duplicidade, ETags) fica guardado no cache do Actions entre execuções
      - name: Recuperar banco da última coleta
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Testes
        run: python -m unittest discover -s tests

      # se a geração falhar (ou o site sair vazio), nada é publicado e o site anterior continua no ar
      - name: Coletar e gerar o site
        run: python gerar_site.py

      - name: Guardar banco
        if: always() && hashFiles('data/radar.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4

  # apaga cópias antigas do banco (fica só a mais recente) e impede que o GitHub
  # desligue o agendamento após 60 dias sem commits. Não roda código do repositório.
  manutencao:
    needs: coletar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key radar-db- --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/radar.yml/enable" || true
